[package]
name = "runar_logging"
version = "0.1.0"
edition = "2021"
authors = ["Rafael Almeida - rafael@iswe.co.nz"]
description = "Logging utilities and macros for the Runar framework"
license = "MIT"
keywords = ["p2p", "encryption", "micro-services", "logging"]
categories = ["development-tools"]
readme = "README.md"
repository = "https://github.com/runar-labs/runar-rust"
homepage = "https://github.com/runar-labs/runar-rust"
documentation = "https://docs.rs/runar_logging"
rust-version = "1.70"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.release]
allow-branch = ["main"]
tag-prefix = "runar_logging-"
tag-name = "{{version}}"
pre-release-replacements = []

[package.metadata.crates-io]
categories = ["development-tools"]
keywords = ["p2p", "encryption", "micro-services", "logging"]

[features]
default = []

[dependencies]
log = "0.4"
env_logger = "0.10"
once_cell = "1.19"
